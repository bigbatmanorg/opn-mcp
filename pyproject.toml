[project]
name = "opn-mcp"
version = "0.1.0"
description = "MCP server for OPNsense with full API coverage from an index of the sources"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.10,<2",
    "httpx>=0.27,<1",
]

[project.scripts]
opn-mcp = "opn_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opn_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["lab: runs against the disposable lab (needs OPN_LAB=1 and lab credentials)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
